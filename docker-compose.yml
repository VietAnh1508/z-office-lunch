services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: office_lunch
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      # -h forces a real TCP check. Without it, pg_isready connects over the
      # unix socket by default and can report healthy against the init-time
      # temporary server Postgres runs docker-entrypoint-initdb.d scripts
      # against — before TCP on 5432 is actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d office_lunch -h 127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 30s

volumes:
  postgres-data:
